<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 取色器 - RGB 色彩空间</title>
    <style>
        * { box-sizing: border-box; }
        html { font-size: 16px; }
        html, body { height: 100%; overscroll-behavior: none; }
        body {
            margin: 0;
            display: flex;
            background: #0f1115;
            color: #e8e8e8;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            overflow: hidden;
        }
        #app { display: flex; width: 100%; height: 100%; overscroll-behavior-x: none; }
        #viewport { position: relative; flex: 1; min-width: 0; }
        #canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        #panel {
            width: 20rem;
            flex: none;
            padding: 1.125rem;
            overflow-y: auto;
            background: #171a21;
            border-left: 1px solid #2a2e37;
        }
        h1 { font-size: 1.125rem; margin: 0 0 0.375rem; }
        .hint { display: flex; flex-wrap: wrap; gap: 0.1875rem 0.75rem; font-size: 0.75rem; color: #9aa0a6; margin: 0 0 1rem; line-height: 1.5; }
        .hint span { white-space: nowrap; }
        .hint strong { color: #cfd3d9; font-weight: 500; }
        .swatch-block { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.875rem; }
        .swatch {
            width: 4.5rem; height: 4.5rem; border-radius: 0.625rem;
            border: 1px solid #3a3f4a; box-shadow: 0 2px 10px rgba(0, 0, 0, .5);
        }
        .swatch-info .rgb { font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
        .swatch-info .hex { font-size: 0.8125rem; color: #9aa0a6; margin: 0.125rem 0 0.375rem; }
        .badge {
            display: inline-block; font-size: 0.6875rem; padding: 0.125rem 0.5rem;
            border-radius: 0.625rem; background: #2a2e37; color: #cfd3d9;
        }
        .badge.hovering { background: #4a4a1a; color: #f5f5c8; }
        section { margin-bottom: 1.125rem; }
        .row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; margin: 0.25rem 0; }
        .row .label { color: #9aa0a6; flex: none; }
        .row .value { font-variant-numeric: tabular-nums; margin-left: auto; }
        .mini-swatch { width: 1.125rem; height: 1.125rem; border-radius: 0.25rem; border: 1px solid #3a3f4a; background: #000; }
        .channel { border: 1px solid #2a2e37; border-radius: 0.625rem; padding: 0.625rem 0.75rem; margin-bottom: 0.625rem; }
        .channel-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.375rem; font-size: 0.8125rem; }
        .tag {
            width: 1.375rem; height: 1.375rem; border-radius: 0.375rem; color: #000;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.75rem;
        }
        .tag-r { background: #ff5a5a; }
        .tag-g { background: #5aff7a; }
        .tag-b { background: #5a8cff; }
        .channel .range { margin-left: auto; color: #9aa0a6; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
        .range-control { --range-inset: 0.5625rem; --thumb-size: 1.125rem; position: relative; height: 1.875rem; touch-action: none; user-select: none; }
        .range-track { position: absolute; left: var(--range-inset); right: var(--range-inset); top: 0.8125rem; height: 0.25rem; border: 1px solid #59616e; border-radius: 0.25rem; background: #454b55; }
        .range-fill { position: absolute; top: 0.8125rem; height: 0.25rem; border-radius: 0.25rem; background: #7a8cff; pointer-events: none; }
        .range-thumb { position: absolute; top: 0.9375rem; width: var(--thumb-size); height: var(--thumb-size); transform: translate(-50%, -50%); border: 0.125rem solid #aeb8ff; border-radius: 50%; background: #7a8cff; cursor: ew-resize; z-index: 1; }
        .range-thumb::before { content: ""; position: absolute; inset: -0.625rem; }
        .range-thumb:focus-visible { outline: 0.125rem solid #fff; outline-offset: 0.125rem; }
        @media (max-width: 760px) {
            #app { flex-direction: column; height: 100vh; height: 100dvh; min-height: 0; }
            #viewport { flex: none; height: 40vh; height: 40dvh; min-height: 230px; touch-action: none; }
            #canvas { touch-action: none; }
            html { font-size: clamp(15px, 4vw, 17px); }
            #panel { width: 100%; flex: 1; min-height: 0; padding: 0.875rem 0.875rem max(0.875rem, env(safe-area-inset-bottom)); border-left: 0; border-top: 1px solid #2a2e37; touch-action: pan-y; overscroll-behavior: contain; overscroll-behavior-x: none; }
            h1 { margin-bottom: 0.25rem; }
            .hint { margin-bottom: 0.625rem; }
            .swatch { width: 3.75rem; height: 3.75rem; }
            section { margin-bottom: 0.75rem; }
            .channel { padding: 0.5rem 0.625rem; margin-bottom: 0.5rem; }
            .range-control { --range-inset: 0.625rem; --thumb-size: 1.25rem; height: 2.5rem; }
            .range-track, .range-fill { top: 1.125rem; }
            .range-thumb { top: 1.25rem; }
            .range-thumb::before { inset: -0.75rem; }
        }
        @media (max-width: 760px) and (max-height: 500px) {
            #app { flex-direction: row; }
            #viewport { flex: 1; width: auto; height: 100%; min-height: 0; }
            #panel { width: min(45vw, 20rem); height: 100%; flex: none; border-top: 0; border-left: 1px solid #2a2e37; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="viewport">
            <canvas id="canvas"></canvas>
        </div>
        <aside id="panel">
            <h1>3D 取色器</h1>
            <p class="hint">
                <span><strong>范围</strong> 拖动两端</span>
                <span><strong>取色</strong> 点按或悬停模型</span>
                <span><strong>视角</strong> 拖动旋转 · 滚轮或双指缩放</span>
            </p>

            <section class="swatch-block">
                <div class="swatch" id="mainSwatch" style="background:#FFFFFF;"></div>
                <div class="swatch-info">
                    <div class="rgb" id="mainRGB">R 255 · G 255 · B 255</div>
                    <div class="hex" id="mainHex">#FFFFFF</div>
                    <span class="badge" id="mainLabel">当前选中</span>
                </div>
            </section>

            <section>
                <div class="row"><span class="label">悬停位置</span><span class="value" id="hoverPos">—</span></div>
                <div class="row">
                    <span class="label">悬停颜色</span>
                    <span class="mini-swatch" id="hoverSwatch"></span>
                    <span class="value" id="hoverColor">—</span>
                </div>
            </section>

            <section id="channels"></section>

        </aside>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./index.js"></script>
</body>
</html>
