<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 取色器 - RGB 色彩空间</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            background: #0f1115;
            color: #e8e8e8;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            overflow: hidden;
        }
        #app { display: flex; width: 100%; height: 100%; }
        #viewport { position: relative; flex: 1; min-width: 0; }
        #canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        #panel {
            width: 320px;
            flex: none;
            padding: 18px;
            overflow-y: auto;
            background: #171a21;
            border-left: 1px solid #2a2e37;
        }
        h1 { font-size: 18px; margin: 0 0 6px; }
        .hint { font-size: 12px; color: #9aa0a6; margin: 0 0 16px; line-height: 1.5; }
        .swatch-block { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
        .swatch {
            width: 72px; height: 72px; border-radius: 10px;
            border: 1px solid #3a3f4a; box-shadow: 0 2px 10px rgba(0, 0, 0, .5);
        }
        .swatch-info .rgb { font-size: 15px; font-variant-numeric: tabular-nums; }
        .swatch-info .hex { font-size: 13px; color: #9aa0a6; margin: 2px 0 6px; }
        .badge {
            display: inline-block; font-size: 11px; padding: 2px 8px;
            border-radius: 10px; background: #2a2e37; color: #cfd3d9;
        }
        .badge.hovering { background: #4a4a1a; color: #f5f5c8; }
        section { margin-bottom: 18px; }
        .row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0; }
        .row .label { color: #9aa0a6; flex: none; }
        .row .value { font-variant-numeric: tabular-nums; margin-left: auto; }
        .mini-swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #3a3f4a; background: #000; }
        .channel { border: 1px solid #2a2e37; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
        .channel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
        .tag {
            width: 22px; height: 22px; border-radius: 6px; color: #000;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 12px;
        }
        .tag-r { background: #ff5a5a; }
        .tag-g { background: #5aff7a; }
        .tag-b { background: #5a8cff; }
        .channel .range { margin-left: auto; color: #9aa0a6; font-size: 12px; font-variant-numeric: tabular-nums; }
        .channel input[type=range] { width: 100%; margin: 2px 0; accent-color: #7a8cff; }
        .range-control { position: relative; height: 30px; touch-action: none; user-select: none; }
        .range-track { position: absolute; left: 9px; right: 9px; top: 13px; height: 4px; border: 1px solid #59616e; border-radius: 4px; background: #454b55; }
        .range-fill { position: absolute; top: 13px; height: 4px; border-radius: 4px; background: #7a8cff; pointer-events: none; }
        .range-thumb { position: absolute; top: 15px; width: 18px; height: 18px; transform: translate(-50%, -50%); border: 2px solid #aeb8ff; border-radius: 50%; background: #7a8cff; cursor: ew-resize; z-index: 1; }
        .range-thumb:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .foot { font-size: 11px; color: #6b7280; line-height: 1.6; margin: 0; }
    </style>
</head>
<body>
    <div id="app">
        <div id="viewport">
            <canvas id="canvas"></canvas>
        </div>
        <aside id="panel">
            <h1>3D 取色器</h1>
            <p class="hint">分别拖动 R / G / B 的最小值和最大值，调整当前颜色范围。3D 视图仅展示范围模型；悬停表面查看对应色值，拖动空白处旋转视角。</p>

            <section class="swatch-block">
                <div class="swatch" id="mainSwatch" style="background:#FFFFFF;"></div>
                <div class="swatch-info">
                    <div class="rgb" id="mainRGB">R 255 · G 255 · B 255</div>
                    <div class="hex" id="mainHex">#FFFFFF</div>
                    <span class="badge" id="mainLabel">当前选中</span>
                </div>
            </section>

            <section>
                <div class="row"><span class="label">悬停位置</span><span class="value" id="hoverPos">—</span></div>
                <div class="row">
                    <span class="label">悬停颜色</span>
                    <span class="mini-swatch" id="hoverSwatch"></span>
                    <span class="value" id="hoverColor">—</span>
                </div>
            </section>

            <section id="channels"></section>

            <p class="foot">每个通道的最小值与最大值可独立调整；滚轮缩放视图。</p>
        </aside>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./index.js"></script>
</body>
</html>
